; Make PHP notice changed files immediately.
; Without this, PHP keeps running old compiled code (OPcache)
; and theme changes only show up after recreating the container.
; Cost: one quick file check per included file, negligible for this site.
opcache.validate_timestamps=1
opcache.revalidate_freq=0

; Don't keep compiled code in an on-disk cache either (survives restarts).
opcache.file_cache=